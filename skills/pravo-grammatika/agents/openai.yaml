interface:
  display_name: pravo grammatika
  short_description: 'Грамматика юридического текста на практике РФ — третий скилл
    тривиума (грамматика · логика ·

    риторика). Проверяет ФОРМУ ВЫРАЖЕНИЯ: говорит ли формулировка однозначно то, что
    задумано, или

    допускает два прочтения. Ядро — синтаксическая неоднозначность и пунктуация, порождающие
    споры о

    толковании договора: проблема последнего антецедента, область действия «и/или»
    и «в том числе»,

    границы сроков («до»/«не позднее»), анафора и отсылки, деонтическая модальность
    (вправе/обязан).

    Используй, когда нужно: найти двусмысленность («проверь формулировку»), проверить
    пунктуацию или

    модальность («вправе или обязан»), переписать пункт однозначно («убери двусмысленность»).

    Критерий замечания — как меняется правовой результат, а не «правило требует запятую».
    Смысл не

    додумывает: показывает оба прочтения, выбор оставляет автору. Валидность — флаг
    [→

    pravo-logika], убедительность — [→ pravo-ritorika], нормы и практика — [требует
    проверки].

    English: syntactic ambiguity, punctuation changing rights, deontic modality.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
