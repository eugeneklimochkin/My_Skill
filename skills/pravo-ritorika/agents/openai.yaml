interface:
  display_name: pravo ritorika
  short_description: 'Классическая риторика для ПИСЬМЕННОЙ юридической позиции на
    материале практики РФ. Проверяет и

    усиливает УБЕДИТЕЛЬНОСТЬ письменного текста (меморандум, процессуальный документ,
    претензия,

    заключение) для конкретного адресата: выбор линии позиции по статусной теории,
    порядок и

    структура аргументов (диспозиция), адаптация подачи под аудиторию (суд, нотариус,
    госорган,

    оппонент, клиент), стресс-тест позиции глазами сильнейшего оппонента. Используй,
    когда нужно:

    усилить правовую позицию («усиль позицию», «сделай убедительнее»), проверить структуру
    («проверь

    структуру аргументации»), выбрать линию спора («на чём строить позицию», «какой
    статус спора»),

    адаптировать текст под адресата («переупакуй для суда / для переговоров»), сыграть
    оппонента

    («разбей мою позицию», «стресс-тест»). Валидность вывода не проверяет — это pravo-logika;

    усиливает только честную аргументацию, манипулятивные приёмы не предлагает. English:
    legal

    rhetoric, stress-testing, steelmanning the opponent.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
