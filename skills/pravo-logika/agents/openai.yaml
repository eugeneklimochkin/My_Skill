interface:
  display_name: pravo logika
  short_description: 'Формальная логика правового рассуждения на праве РФ. Проверяет
    ФОРМУ юридического вывода:

    применение нормы к факту (субсумпцию), корректность толкования, разграничение
    вопроса права и

    вопроса факта, логическую однозначность договорных формулировок. Используй, когда
    нужно:

    проверить правовую логику текста («проверь правовую логику», «разбери меморандум»,
    «найди ошибки

    в аргументации»), исправить аргументацию («поправь квалификацию», «сделай позицию
    логичной»),

    проверить формулировку на однозначность («есть ли двусмысленность»), сравнить
    две встречные

    позиции («где расходятся истец и ответчик»), разобрать норму («разложи статью»),
    проверить сроки

    и механику закрытия сделки («signing и closing»). Право по существу не проверяет:
    нормы и

    практику по памяти не подставляет, а помечает флагом к проверке человеком. Синтаксическую

    неоднозначность отдаёт pravo-grammatika, убедительность подачи — pravo-ritorika.
    English: legal

    argumentation review, subsumption, interpretation errors.'
  icon_small: assets/icon.svg
  icon_large: assets/icon.svg
policy:
  products:
  - chatgpt
  - codex
  - api
  - atlas
  allow_implicit_invocation: true
